name: Bug report
description: 报告可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请先删除日志、截图和输出中的令牌及个人游玩数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你原本期望什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行……
        2. 打开……
        3. 看到……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit 或版本
      placeholder: v0.2.0 或 commit SHA
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: macOS 15, Python 3.12, Chrome 140
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容中不包含令牌、账户回调链接或私人数据库
          required: true
